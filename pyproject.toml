[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "parksres"
version = "0.0.1"

dependencies = [
  "python-dotenv",
  "pandas",
  "openpyxl",
  "geopandas",
]

requires-python = ">=3.12.3"

authors_maintainers = [
  {name = "Calvin Leighton", email = "calvin.d.leighton@outlook.com"},
]

description = ""
readme = "README.rst" 

license = "MIT"
license-files = ["LICEN[CS]E.*"]
keywords = ["PARKSRES"]

classifiers = []

[project.optional-dependencies]
gui = []
cli = []
all = ["parksres[gui, cli]"]

[project.urls]
Homepage = ""
Documentation = ""
Repository = ""
"Bug Tracker" = ""
Changelog = ""

[project.scripts]
process-metro-data = "parksres.scripts.map_metro_data:main"
process-types = "parksres.scripts.map_types:main"
build-parks-vic = "parksres.scripts.build_parks_vic:main"
crown-to-json = "parksres.scripts.crown_to_json:main"