<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alchemer harness</title>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; }
  #controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 14px; }
  #controls label { display: flex; flex-direction: column; font-size: 12px; font-weight: 600; color: #444; }
  #controls input, #controls select { padding: 6px; font: inherit; min-width: 260px; }
  #controls button { padding: 8px 14px; font: inherit; cursor: pointer; }
  #fields { border-collapse: collapse; margin-top: 16px; width: 100%; font-size: 13px; }
  #fields th, #fields td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; vertical-align: top; }
  #fields th { background: #f5f5f5; }
  #fields td.val { font-family: ui-monospace, monospace; word-break: break-word; }
  .empty { color: #999; font-style: italic; }
  #hidden-fields { display: none; }
  .sg-button-bar { margin-top: 12px; padding: 10px; background: #f0f0f0; border: 1px dashed #bbb; }
  .sg-button { padding: 8px 18px; font: inherit; cursor: pointer; margin-right: 8px; }
  #confirm { margin: 10px 0; }
  #bar-state { font-size: 12px; color: #666; margin: 6px 0 0; }
</style>
</head>
<body>

<div id="controls">
  <label>Action file
    <select id="action">
      <option value="../alchemer-map-js/javascript-action.js">javascript-action.js (parks)</option>
      <option value="../alchemer-map-js/javascript-action-pp.js">javascript-action-pp.js (piers)</option>
      <option value="../alchemer-map-js/javascript-action-wp.js">javascript-action-wp.js (waterways)</option>
      <option value="../alchemer-map-js/javascript-action-area.js">javascript-action-area.js (areas)</option>
    </select>
  </label>
  <label>Payload URL (merge id 182)
    <input id="payload-url" placeholder="https://...blob.core.windows.net/...json?sp=r&amp;...">
  </label>
  <label>Maps API key (merge id 181)
    <input id="maps-key" placeholder="AIza...">
  </label>
  <label><span>&nbsp;</span><button id="run">Run action</button></label>
  <label><span>&nbsp;</span><button id="omit">Run with hidden fields missing</button></label>
</div>

<div id="box"></div>
<div id="hidden-fields"></div>
<div class="sg-button-bar">
  <button id="sg_BackButton" class="sg-button sg-back-button" type="button">Back</button>
  <button id="sg_NextButton" class="sg-button sg-next-button" type="button">Next</button>
</div>
<p id="bar-state"></p>

<table id="fields">
  <thead><tr><th>Hidden field</th><th>Element id</th><th>Value the survey would save</th></tr></thead>
  <tbody></tbody>
</table>

<script src="harness.js"></script>
</body>
</html>
